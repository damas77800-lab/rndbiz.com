<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#101e36"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#007da5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#007da5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c98b"/>
      <stop offset="100%" stop-color="#b8854f"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d99e"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.7"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative orbital rings (right side) -->
  <g transform="translate(950, 315)" opacity="0.4">
    <circle cx="0" cy="0" r="280" fill="none" stroke="#d4a574" stroke-width="1"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="#d4a574" stroke-width="1"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#d4a574" stroke-width="1"/>
  </g>
  <g transform="translate(950, 315)">
    <circle cx="0" cy="0" r="100" fill="url(#gold)" opacity="0.92"/>
    <text x="0" y="-10" font-family="DejaVu Sans" font-size="64" font-weight="900" fill="#0a1628" text-anchor="middle" letter-spacing="-3">3</text>
    <text x="0" y="38" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#0a1628" text-anchor="middle" letter-spacing="2">MIN</text>
  </g>
  <!-- Sparkle dots -->
  <circle cx="800" cy="180" r="3" fill="#d4a574"/>
  <circle cx="1100" cy="450" r="2" fill="#d4a574" opacity="0.6"/>
  <circle cx="720" cy="500" r="2" fill="#007da5" opacity="0.7"/>

  <!-- Brand mark -->
  <rect x="80" y="80" width="68" height="68" rx="18" fill="url(#gold)"/>
  <text x="114" y="135" font-family="DejaVu Sans" font-size="48" font-weight="900" fill="#0a1628" text-anchor="middle">R</text>

  <!-- Logo text (English-safe) -->
  <text x="172" y="115" font-family="DejaVu Sans" font-size="22" font-weight="900" fill="#ffffff">RNDBIZ PARTNER</text>
  <text x="172" y="140" font-family="DejaVu Sans" font-size="11" font-weight="700" fill="#d4a574" letter-spacing="4">POLICY FUND ANALYTICS</text>

  <!-- Eyebrow tag -->
  <rect x="80" y="220" width="160" height="40" rx="20" fill="rgba(212,165,116,0.12)" stroke="#d4a574" stroke-width="1"/>
  <text x="160" y="246" font-family="DejaVu Sans" font-size="14" font-weight="800" fill="#d4a574" text-anchor="middle" letter-spacing="2">2026 EDITION</text>

  <!-- Big number / Stat -->
  <text x="80" y="380" font-family="DejaVu Sans" font-size="120" font-weight="900" fill="url(#goldText)" letter-spacing="-6">15.29T</text>
  <text x="80" y="430" font-family="DejaVu Sans" font-size="22" font-weight="600" fill="#a8b3c7" letter-spacing="1">KRW Government Fund · 300+ Programs</text>

  <!-- Vertical accent bar -->
  <rect x="80" y="470" width="4" height="40" fill="url(#gold)"/>
  <text x="100" y="486" font-family="DejaVu Sans" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="2">AI · BIZ DIAGNOSIS · EXPERT MATCH</text>
  <text x="100" y="510" font-family="DejaVu Sans" font-size="13" font-weight="500" fill="#7b89a3">Find your perfect policy fund in 3 minutes.</text>

  <!-- Footer divider -->
  <line x1="80" y1="555" x2="1120" y2="555" stroke="#1f2d4a" stroke-width="1"/>
  <text x="80" y="595" font-family="DejaVu Sans" font-size="20" font-weight="900" fill="#ffffff">analyze.rndbiz.kr</text>
  <text x="1120" y="595" font-family="DejaVu Sans" font-size="14" font-weight="700" fill="#a8b3c7" text-anchor="end">18,000+ CASES · KRW 230M AVG</text>
</svg>
